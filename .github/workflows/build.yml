# tag（v*）推送会构建 NativeAOT 单文件 exe、发布 Release，并调用 sync-scoop.yml
# 同步 bucket/ 里的 Scoop manifest —— 也就是 `git push origin v1.0.1` 一条命令完成发版。
# main 推送与 PR 只做构建校验（含启动冒烟测试），不发布。
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 (NativeAOT)
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish the single-file native executable
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }

      - name: Locate the executable and compute its checksum
        id: artifact
        shell: pwsh
        run: |
          $exe = 'bin\Release\net8.0-windows\win-x64\publish\MacThreeFingerDrag.exe'
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }

          $item = Get-Item $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "path=$exe"            >> $env:GITHUB_OUTPUT
          "name=$($item.Name)"   >> $env:GITHUB_OUTPUT
          "size=$($item.Length)" >> $env:GITHUB_OUTPUT
          "sha256=$hash"         >> $env:GITHUB_OUTPUT

          Write-Host "built : $exe"
          Write-Host ("size  : {0:N0} bytes" -f $item.Length)
          Write-Host "sha256: $hash"

      # --make-icon 只渲染一个 .ico 就退出，是「这份原生二进制能否启动」的无副作用冒烟测试
      - name: Smoke test (the binary must start and exit)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.ico'
          $process = Start-Process -FilePath "${{ steps.artifact.outputs.path }}" `
                                   -ArgumentList @('--make-icon', $out) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "smoke test failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path $out)) { throw 'the smoke test produced no output' }
          Write-Host "smoke test ok ($((Get-Item $out).Length) bytes of icon)"

      # 用 .github/release-notes.md 模板渲染发布说明；占位符 leftover 直接让 job 失败，
      # 所以不可能发出一个校验和是旧的 Release。
      - name: Render the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: pwsh
        run: |
          $template = '.github/release-notes.md'
          if (-not (Test-Path $template)) { throw "$template is missing" }

          $size = [long]'${{ steps.artifact.outputs.size }}'
          $sha = '${{ steps.artifact.outputs.sha256 }}'
          $commit = '${{ github.sha }}'

          $notes = [System.IO.File]::ReadAllText($template, [System.Text.Encoding]::UTF8)
          $notes = $notes.Replace('{{VERSION}}', $env:GITHUB_REF_NAME)
          $notes = $notes.Replace('{{COMMIT}}', $commit.Substring(0, 7))
          $notes = $notes.Replace('{{BUILD_DATE}}', (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))
          $notes = $notes.Replace('{{SIZE}}', ('{0:N0} 字节（{1:N0} KiB）' -f $size, ($size / 1KB)))
          $notes = $notes.Replace('{{SHA256}}', $sha)

          $leftover = [regex]::Matches($notes, '\{\{[A-Z0-9_]+\}\}')
          if ($leftover.Count -gt 0) {
            throw "unreplaced placeholder(s): $((($leftover | ForEach-Object { $_.Value }) -join ', '))"
          }

          $path = Join-Path $env:RUNNER_TEMP 'release-notes.rendered.md'
          [System.IO.File]::WriteAllText($path, $notes, (New-Object System.Text.UTF8Encoding($false)))
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host 'rendered the release notes'

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "${{ steps.artifact.outputs.path }}"
          $notes = "${{ steps.notes.outputs.path }}"

          # <exe>.sha256 是 Scoop manifest 的 autoupdate.hash 读取的文件
          $checksum = Join-Path $env:RUNNER_TEMP 'MacThreeFingerDrag.exe.sha256'
          $hash = "${{ steps.artifact.outputs.sha256 }}".ToLowerInvariant()
          "$hash  MacThreeFingerDrag.exe" | Set-Content -Path $checksum -Encoding ascii

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists - replacing the assets and the notes"
            gh release upload $tag $exe $checksum --clobber
            gh release edit $tag --notes-file $notes
          } else {
            Write-Host "creating release $tag"
            $arguments = @($tag, $exe, $checksum, '--title', $tag, '--notes-file', $notes)
            if ($tag -match '-') {
              # 例如 v1.1.0-rc1：标为预发布，不占用 "Latest"
              Write-Host 'tag contains a suffix - marking the release as a pre-release'
              $arguments += '--prerelease'
            }
            gh release create @arguments
          }

          Write-Host "attached sha256: $hash"
          gh release view $tag --json tagName,isDraft,isPrerelease,assets

  # 发布成功后把 Scoop manifest 同步到 bucket/（发版 → bucket 更新，一条命令闭环）
  scoop-manifest:
    name: Sync the Scoop manifest
    needs: [ windows-x64 ]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/sync-scoop.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
