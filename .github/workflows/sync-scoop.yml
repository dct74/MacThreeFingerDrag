# 保持 bucket/macthreefingerdrag.json 与本仓库最新 Release 同步，
# 这样 `scoop install macthreefingerdrag` 拿到的永远是当前版本。
#
# 三种调用方式（同一份实现，避免重复代码）：
#   * workflow_call  —— 由 build.yml 在发版后调用（正常路径，秒级同步）
#   * schedule       —— 每日兜底：万一某次 Release 没同步到，第二天纠正；
#                       顺便确保 Release 里有 <exe>.sha256（manifest 的 autoupdate.hash 依赖它）
#   * workflow_dispatch —— 手动补历史版本
name: Scoop manifest

on:
  workflow_call:
    inputs:
      tag:
        description: '要同步的 release tag（如 v1.0.1）。留空则取最新 release。'
        required: false
        type: string
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 release tag（如 v1.0.1）。留空则取最新 release。'
        required: false

permissions:
  contents: write

concurrency:
  group: scoop-manifest
  cancel-in-progress: false

jobs:
  bump:
    runs-on: windows-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync bucket/macthreefingerdrag.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = (gh release view --json tagName -q .tagName).Trim() }
          if ($tag -notmatch '^v\d') { throw "unexpected release tag: '$tag'" }

          # 预发布（如 v1.1.0-rc1）不进 bucket：scoop 用户拿到的应该是正式版
          if ($tag -match '-') {
            Write-Host "pre-release tag '$tag' - the bucket keeps the latest stable release"
            exit 0
          }

          $version = $tag.Substring(1)
          Write-Host "target release: $tag (version $version)"

          $asset = 'MacThreeFingerDrag.exe'
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$asset"

          $file = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri $url -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "sha256: $hash"

          # manifest 的 autoupdate.hash 读的是 <exe>.sha256，所以让 Release 始终带着它
          $checksum = Join-Path $env:RUNNER_TEMP "$asset.sha256"
          "$hash  $asset" | Set-Content -Path $checksum -Encoding ascii
          gh release upload $tag $checksum --clobber

          # 只替换顶层的 version / url / hash 三行，保持文件格式与 autoupdate 模板原样
          # （注意：必须用 Regex 实例的 Replace(input, replacement, count) 重载；
          #  静态 [regex]::Replace($s,$p,$r,1) 的第 4 个参数是 RegexOptions，会变成"忽略大小写且全部替换"，
          #  那会把 autoupdate.url 里的 $version 模板也写死，从而废掉以后的自动更新）
          $path = 'bucket/macthreefingerdrag.json'
          if (-not (Test-Path $path)) { throw "$path is missing" }
          $json = Get-Content -Raw $path
          $json = ([regex]'(?m)^(\s*"version":\s*")[^"]*(")').Replace($json, "`${1}$version`${2}", 1)
          $json = ([regex]'(?m)^(\s*"url":\s*")[^"]*(")').Replace($json,     "`${1}$url`${2}", 1)
          $json = ([regex]'(?m)^(\s*"hash":\s*")[^"]*(")').Replace($json,    "`${1}$hash`${2}", 1)
          Set-Content -Path $path -Value $json -NoNewline

          $check = Get-Content -Raw $path | ConvertFrom-Json
          if ($check.version -ne $version) { throw "version not written: $($check.version)" }
          if ($check.hash -ne $hash)       { throw "hash not written: $($check.hash)" }
          if ($check.autoupdate.url -notmatch '\$version') { throw 'autoupdate.url lost its $version placeholder' }
          Write-Host "manifest ok: version=$($check.version) hash=$($check.hash.Substring(0, 12))..."

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          if (git diff --cached --quiet) { Write-Host 'manifest already up to date'; exit 0 }
          git commit -m "scoop: $asset $version"
          git push
